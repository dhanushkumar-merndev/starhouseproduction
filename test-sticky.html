<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    overflow-x: clip; /* test if it breaks sticky */
    width: 100vw;
  }
  .sticky {
    position: sticky;
    top: 0;
    height: 100px;
    background: red;
  }
  .content {
    height: 2000px;
    background: linear-gradient(blue, green);
  }
</style>
</head>
<body>
  <div class="sticky">Sticky</div>
  <div class="content"></div>
</body>
</html>
